<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Operaciones Matemáticas</title>
    <link href="https://fonts.googleapis.com/css?family=Inknut+Antiqua" rel="stylesheet">
    <link href="miEstilo.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="misFunciones.js"></script>
</head>
<body class="body-num">

<div class="centrado div-conver">
    <h1>Operaciones Matemáticas</h1>
    <form class="operacionesMat">
        <p>
            <input aria-label="Suma, operando 1" id="nums1" type="text" name="sum_num1" onchange="calcularOperacion('suma')">
            +
            <input aria-label="Suma, operando 2" id="nums2" type="text" name="sum_num2" onchange="calcularOperacion('suma')">
            =
            <span id="totalS" class="resultado">-</span>
        </p>
        <p>
            <input aria-label="Resta, operando 1" id="numr1" type="text" name="res_num1" onchange="calcularOperacion('resta')">
            -
            <input aria-label="Resta, operando 2" id="numr2" type="text" name="res_num2" onchange="calcularOperacion('resta')">
            =
            <span id="totalR" class="resultado">-</span>
        </p>
        <p>
            <input aria-label="Multiplicación, operando 1" id="numm1" type="text" name="mul_num1" onchange="calcularOperacion('multiplicacion')">
            x
            <input aria-label="Multiplicación, operando 2" id="numm2" type="text" name="mul_num2" onchange="calcularOperacion('multiplicacion')">
            =
            <span id="totalM" class="resultado">-</span>
        </p>
        <p>
            <input aria-label="División, operando 1" id="numd1" type="text" name="div_num1" onchange="calcularOperacion('division')">
            /
            <input aria-label="División, operando 2" id="numd2" type="text" name="div_num2" onchange="calcularOperacion('division')">
            =
            <span id="totalD" class="resultado">-</span>
        </p>
    </form>
</div>
</body>
</html>
